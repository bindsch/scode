# scode sandbox configuration
# Copy to ~/.config/scode/sandbox.yaml
#
# Entries here are merged with built-in defaults:
#   - "blocked" adds to the default blocked list
#   - "allowed" requests recursive access, subject to policy precedence
#   - scalar options (net, fs_mode, strict, scrub_env, grok_defense) set defaults
#
# See docs/configuration.md and docs/policy.md for scalar and path precedence.
#
# Built-in defaults already block:
#   personal documents/media and shell/database histories
#   ~/.ssh, ~/.gnupg, ~/.pki, password stores, and keyrings
#   cloud/container/IaC credentials and package/VCS tokens
#   ~/Library (macOS, without automatic credential carve-outs)
#   + additional Linux-specific blocks (browser profiles, keyrings, etc.)
#
# See also:
#   sandbox-strict.yaml - for use with --strict flag
#   sandbox-paranoid.yaml - restrictive scalars; add --trust untrusted for review
#   sandbox-permissive.yaml - opens up dirs for trusted projects
#   sandbox-cloud-eng.yaml - for cloud/infra engineers
#   sandbox-grok.yaml - Grok collection and Git-history defense

# Sandbox flags (uncomment to enable)
# These set scalar defaults; detected Grok defense still forces strict/scrub.
# net: off             # disable network (same as --no-net)
# fs_mode: ro          # read-only project dir (same as --ro)
# strict: true         # deny-default sandbox (same as --strict)
# scrub_env: true      # strip API keys from env (same as --scrub-env)
# grok_defense: true   # harden Grok collection and project-secret access

# Block additional directories beyond defaults
# Unquoted scalars allow inline comments. Unquoted list paths containing " #"
# are rejected; quote paths and put any comment after the closing quote.
blocked:
  # - ~/Dropbox
  # - ~/OneDrive

# Allow specific directories, overriding defaults
allowed:
  # - ~/Documents/projects
  # - ~/Downloads/datasets
