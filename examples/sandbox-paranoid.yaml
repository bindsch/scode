# scode paranoid sandbox configuration
# Copy to ~/.config/scode/sandbox.yaml
#
# Restrictive scalars; detected harness state and credential copying remain.
# For untrusted review: scode --trust untrusted --config this-file.yaml command
# Built-in rules already block SSH keys, GitHub CLI tokens, and personal data.
# This profile adds cloud-sync directories.
# Network disabled, env scrubbed, strict mode, read-only project.

strict: true
net: off
fs_mode: ro
scrub_env: true

blocked:
  # Cloud sync
  - ~/Dropbox
  - ~/OneDrive
  - ~/Google Drive
  - ~/iCloud Drive

allowed:
  # No explicit grants. Automatic harness grants still apply without the preset.
