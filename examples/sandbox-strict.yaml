# scode strict sandbox configuration
# Copy to ~/.config/scode/sandbox.yaml
#
# Enables strict mode by default. No need to pass --strict on the command line.
# Strict grants project, system essentials, private scratch, explicit paths,
# and detected harness state (read-write).
# "blocked" entries here mainly matter when you also allow a parent path.

strict: true

# Additional directories to explicitly block
blocked:
  - ~/Dropbox
  - ~/OneDrive

# Automatic harness grants remain; --trust untrusted disables them.
# Use "allowed" to grant read-write access to specific extra directories.
allowed:
  # - ~/shared-libs
